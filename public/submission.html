<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Submission Review — VIT ProjectHub</title>
<script src="/js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>

<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <a href="/" class="brand-logo">
      <span class="brand-mark"><img src="/img/vit-logo.png" alt="Vishwakarma Institute of Technology logo"></span>ProjectHub
    </a>
    <div class="nav-label" style="padding-top:0">Workspace</div>
    <nav class="nav">
      <a class="nav-link" id="dashboardLink" href="/teacher-dashboard.html"><i class="bi bi-grid-1x2"></i>Dashboard</a>
      <a class="nav-link active" href="#"><i class="bi bi-clipboard-check"></i>Submission</a>
    </nav>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-user">
      <span class="js-user-avatar"></span>
      <div class="flex-grow-1 overflow-hidden">
        <div class="text-truncate js-user-name" style="font-size:13px; font-weight:500">-</div>
        <div class="text-muted js-user-role" style="font-size:11px">-</div>
      </div>
    </div>
    <nav class="nav">
      <a href="#" id="logoutBtn" class="nav-link logout-link"><i class="bi bi-box-arrow-right"></i>Log out</a>
    </nav>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-light btn-icon sidebar-toggle-btn" id="sidebarToggle" aria-label="Menu"><i class="bi bi-list"></i></button>
        <div class="topbar-crumb"><a href="#" id="backLink"><i class="bi bi-arrow-left"></i> Assignment</a> <span class="text-faint">/</span> <span style="color:var(--color-fg)">Submission</span></div>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn btn-light btn-icon js-theme-toggle"></button>
        <div class="dropdown">
          <button class="btn btn-light btn-icon position-relative" data-bs-toggle="dropdown" aria-label="Notifications"><i class="bi bi-bell"></i><span class="notif-dot d-none" id="notifBadge"></span></button>
          <div class="dropdown-menu dropdown-menu-end notif-menu p-0">
            <div class="notif-head">
              <strong>Notifications</strong>
              <a href="#" id="markAllReadBtn">Mark all read</a>
            </div>
            <div id="notifList" style="max-height:340px; overflow-y:auto;"></div>
          </div>
        </div>
      </div>
    </header>

    <main class="content-area narrow" id="submissionContent" style="max-width:860px">
      <div class="text-center py-5"><div class="spinner-border spinner-border-sm"></div></div>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/submission.js"></script>
</body>
</html>
